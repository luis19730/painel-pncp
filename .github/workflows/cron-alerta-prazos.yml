name: Estação — alerta de prazos

# Roda de hora em hora: encontra prazos pendentes nas próximas 24h que ainda não
# geraram alerta, envia UM e-mail por usuário (provedor transacional do projeto)
# e marca alerta_enviado=true. Link no rodapé do e-mail para /estacao.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor do secret CRON_SECRET configurado no worker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  alerta-prazos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET."
            exit 1
          fi

      - name: Disparar alerta de prazos
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/alerta-prazos"
