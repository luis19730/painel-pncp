name: Trial - campanha de reativacao diaria

# Dispara o endpoint /api/cron/email-reativacao, que envia o e-mail de
# recuperacao "Seu teste terminou - continue por R$ 19,90/mes" para usuarios
# free com trial expirado que ainda nao receberam o e-mail. O endpoint e
# idempotente (colunas email_reactivation_sent / email_reactivation_sent_at em
# user_planos), entao rodar mais de uma vez por dia e seguro.
#
# Secrets necessarios (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor do secret CRON_SECRET configurado no worker
#
# Dry-run manual: chame o mesmo endpoint com ?dryRun=1 para listar os
# candidatos sem enviar nada.

on:
  schedule:
    # 10:00 BRT (America/Sao_Paulo, UTC-3) = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  email-reativacao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Disparar envio de e-mails de reativacao
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/email-reativacao"