name: Fornecedores — extração em lote

# Dispara /api/cron/extrair-fornecedores, que lê os RESULTADOS por item das
# contratações do PNCP (vencedores e licitantes) e alimenta a base
# `fornecedores` (razão social + CNPJ + valores). O PNCP não publica e-mail.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor do secret CRON_SECRET configurado no worker

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantas contratações processar (1-20)'
        required: false
        default: '4'

jobs:
  extrair-fornecedores:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET."
            exit 1
          fi

      - name: Disparar extração de fornecedores
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMITE: ${{ github.event.inputs.limite || '4' }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 300 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/extrair-fornecedores?limite=${LIMITE}"
