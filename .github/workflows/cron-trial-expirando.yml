name: Trial — sequência de lembretes

# Dispara o endpoint /api/cron/trial-expirando, que envia os lembretes de trial
# nos marcos 7, 6, 4, 3, 2, 1 (antes de expirar) e -2, -3, -6 (depois), para
# quem está em trial e ainda NÃO confirmou assinatura ativa. Cada marco é
# enviado uma única vez por usuário (idempotência via evento trial_reminder em
# analytics_events), então rodar mais de uma vez por dia é seguro.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor do secret CRON_SECRET configurado no worker

on:
  schedule:
    # 09:15 BRT (America/Sao_Paulo, UTC-3) = 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch: {}

jobs:
  trial-lembretes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Disparar lembretes de trial (marcos 7..-6)
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --fail-with-body --retry 3 --retry-delay 5 --max-time 120 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/trial-expirando"
