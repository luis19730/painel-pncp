name: Contatos â€” extraÃ§Ã£o em lote

# Dispara o endpoint /api/cron/extrair-contatos, que baixa o PDF de cada edital
# ativo do PNCP, extrai o texto e grava os e-mails de contato (deduplicados por
# Ã³rgÃ£o+e-mail). Processa poucos editais por execuÃ§Ã£o (default 8) com pausa
# entre downloads (rate limiting). Idempotente: editais jÃ¡ processados sÃ£o
# pulados. Roda a cada 6h para cobrir a base ao longo do dia.
#
# Secrets necessÃ¡rios (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor do secret CRON_SECRET configurado no worker

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos editais processar (1-20)'
        required: false
        default: '8'

jobs:
  extrair-contatos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Disparar extraÃ§Ã£o de contatos
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMITE: ${{ github.event.inputs.limite || '8' }}
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 300 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/extrair-contatos?limite=${LIMITE}"
