name: SICX — atualização automática de links e almoxarifados

# Verifica DIARIAMENTE os links do diretório de almoxarifados e das normas do
# SICX, atualizando status_link e verificado_em de cada registro automaticamente.
# 2 falhas consecutivas colocam o registro "em revisão" (some da lista pública).
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   - PNCP_BASE_URL : https://www.painelpncp.com.br
#   - CRON_SECRET   : mesmo valor configurado no Worker

on:
  schedule:
    # Todos os dias, 06:15 UTC (03:15 de Brasília).
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  verificar-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar secrets
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${PNCP_BASE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Configure os secrets PNCP_BASE_URL e CRON_SECRET."
            exit 1
          fi

      - name: Verificar links do SICX
        env:
          PNCP_BASE_URL: ${{ secrets.PNCP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --fail-with-body --retry 2 --retry-delay 5 --max-time 600 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${PNCP_BASE_URL}/api/cron/sicx-links"
